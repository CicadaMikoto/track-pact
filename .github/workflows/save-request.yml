name: Save Track Pact change
on:
  issues:
    types: [opened, reopened]
permissions:
  contents: write
  issues: write
jobs:
  save:
    if: startsWith(github.event.issue.title, '[Track Pact] ')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate and save the request
        run: node scripts/apply-request.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
